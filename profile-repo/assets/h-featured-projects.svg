<svg xmlns="http://www.w3.org/2000/svg" width="900" height="84" viewBox="0 0 900 84">
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="500" y2="0">
      <stop offset="0" stop-color="#8A2BE2"/>
      <stop offset="0.5" stop-color="#D4B0FF"/>
      <stop offset="1" stop-color="#8A2BE2"/>
      <animate attributeName="x1" values="150;400;150" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="650;900;650" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="u" x1="0" x2="1">
      <stop offset="0" stop-color="#5E2B97" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#BB86FC"/>
      <stop offset="1" stop-color="#5E2B97" stop-opacity="0"/>
    </linearGradient>
    <style>
      .t{font-family:'Segoe UI', 'Helvetica Neue', Arial, sans-serif;font-size:34px;font-weight:700;letter-spacing:1px;fill:url(#g);
         opacity:0;animation:rise 7s ease-out infinite;transform-box:fill-box;transform-origin:center}
      .u{transform-box:fill-box;transform-origin:center;transform:scaleX(0);animation:grow 7s ease-out infinite}
      .d{animation:blink 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      @keyframes rise{0%{opacity:0;transform:translateY(18px)}10%,92%{opacity:1;transform:translateY(0)}100%{opacity:0.9;transform:translateY(0)}}
      @keyframes grow{0%,6%{transform:scaleX(0)}22%,100%{transform:scaleX(1)}}
      @keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.3;transform:scale(0.6)}}
    </style>
  </defs>
  <text class="t" x="450" y="46" text-anchor="middle">FEATURED PROJECTS</text>
  <rect class="u" x="250" y="60" width="400" height="2.5" fill="url(#u)"/>
  <rect class="d" x="228" y="56" width="9" height="9" fill="#8A2BE2" transform="rotate(45 232.5 60.5)"/>
  <rect class="d" x="663" y="56" width="9" height="9" fill="#8A2BE2" transform="rotate(45 667.5 60.5)" style="animation-delay:1.1s"/>
</svg>